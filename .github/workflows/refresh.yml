# Monthly market-data refresh + dashboard rebuild.
# Deliberately runs --market-only: scraped annual sources (BasketNews, Forbes
# archives, EuroLeague API) are refreshed locally and committed — CI never
# scrapes (no data/raw cache on runners, and the sources change annually).
name: monthly-refresh

on:
  schedule:
    - cron: "17 6 3 * *"   # 06:17 UTC on the 3rd of every month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python run_pipeline.py --market-only
      - name: Commit refreshed data and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data analysis/output docs
          git diff --cached --quiet || git commit -m "Monthly market data refresh"
          git push
